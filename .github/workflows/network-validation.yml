name: Validate existing virtual network artifact
on:
  workflow_dispatch:
    inputs:
      image_run:
        description: Run that uploaded the exact native-storage-1-x86_64 ISO
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: native-network-validation
  cancel-in-progress: false
jobs:
  network:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '1'
      MAKEFLAGS: -j1
      ALPENGLOW_FAST_CONTINUATION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install official VM and LuaJIT tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit qemu-system-x86 ovmf
          test "$(df -Pk . | awk 'END {print $4}')" -ge 25165824
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-storage-1-x86_64
          path: build/ci/output
          github-token: ${{ github.token }}
          run-id: ${{ inputs.image_run }}
      - name: Verify exact ISO manifest and strict marker regression
        run: |
          luajit scripts/image-evidence.lua verify
          luajit scripts/test-storage-acceptance.lua
      - name: Cold BIOS virtual DHCP and tty1 readiness (three runs)
        run: luajit scripts/bench-fast-base.lua --iso build/ci/output/alpenglow-rescue-storage-1-x86_64.iso --name virtual-network-validated --network-fixture --runs 3 --timeout 90
      - name: Separate cold UEFI virtual DHCP and tty1 readiness (three runs)
        if: always()
        run: |
          if [ -f build/ci/output/alpenglow-rescue-storage-1-x86_64.iso ]; then
            luajit scripts/bench-fast-base.lua --iso build/ci/output/alpenglow-rescue-storage-1-x86_64.iso --name virtual-network-validated --firmware uefi --network-fixture --runs 3 --timeout 90
          fi
      - name: Preserve raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: virtual-network-validation-evidence
          path: |
            build/bench/**/*.json
            build/bench/**/*.log
            build/bench/**/*.ppm
            build/evidence/image-manifest.json
          if-no-files-found: ignore
          retention-days: 14
