name: Validate existing storage artifact
on:
  workflow_dispatch:
    inputs:
      image_run:
        description: Run that uploaded native-storage-1-x86_64
        required: true
        type: string
      probe:
        description: Test the embedded helper or a recorded external probe
        type: choice
        default: embedded
        options: [embedded, external]
      correct_image:
        description: Apply reviewed shell and terminfo correction to exact base
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: native-storage-validation
  cancel-in-progress: false
jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ALPENGLOW_FAST_CONTINUATION: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install official fixture and VM tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit qemu-system-x86 ovmf e2fsprogs btrfs-progs xfsprogs dosfstools exfatprogs ntfs-3g cryptsetup cpio xorriso curl build-essential
          test "$(df -Pk . | awk 'END {print $4}')" -ge 25165824
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-storage-1-x86_64
          path: build/ci/output
          github-token: ${{ github.token }}
          run-id: ${{ inputs.image_run }}
      - name: Validate LuaJIT runtime and failure handling
        run: |
          luajit scripts/test-fast-monitor.lua
          luajit scripts/test-storage-acceptance.lua
          luajit scripts/test-luajit.lua
      - name: Verify exact image and source manifest
        run: |
          luajit scripts/image-evidence.lua verify
      - name: Apply small reviewed native correction
        if: inputs.correct_image
        run: sh scripts/correct-storage-image.sh
      - name: Upload exact corrected candidate
        if: inputs.correct_image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-storage-1a-x86_64
          path: build/ci/output/*
          if-no-files-found: error
          retention-days: 14
      - name: Record final test image manifest
        run: cp build/ci/output/manifest.json build/evidence/image-manifest.json
      - name: Create regular-file synthetic fixtures
        run: sh scripts/make-storage-fixtures.sh
      - name: Select test probe
        env:
          PROBE: ${{ inputs.probe }}
        run: |
          if [ "$PROBE" = external ]; then echo 'PROBE_ARGS=--probe-script scripts/smoke-storage.sh' >> "$GITHUB_ENV"; fi
      - name: BIOS storage probe (three cold processes)
        run: luajit scripts/bench-fast-base.lua --iso build/ci/output/alpenglow-rescue-storage-1-x86_64.iso --name storage-validation --fixtures ${PROBE_ARGS:-} --runs 3 --timeout 120
      - name: UEFI storage probe (three cold processes)
        if: always()
        run: |
          if [ -f build/fixtures/ext4.img ]; then
            luajit scripts/bench-fast-base.lua --iso build/ci/output/alpenglow-rescue-storage-1-x86_64.iso --name storage-validation --firmware uefi --fixtures ${PROBE_ARGS:-} --runs 3 --timeout 120
          fi
      - name: Preserve test evidence and external probe
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storage-validation-evidence
          path: |
            build/bench/**/*.json
            build/bench/**/*.log
            build/bench/**/*.ppm
            build/evidence/*.json
            scripts/smoke-storage.sh
          if-no-files-found: ignore
          retention-days: 14
